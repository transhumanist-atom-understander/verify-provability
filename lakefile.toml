name = "verify-provability"
defaultTargets = ["GLVerify"]

[[require]]
name = "decide-provability"
git = "https://github.com/transhumanist-atom-understander/decide-provability"
rev = "main"

[[require]]
name = "ProvabilityLogic"
git = "https://github.com/FormalizedFormalLogic/ProvabilityLogic"
rev = "60c41f4e6b1914b5f24f498d47c2cb8c003160f6"

# The Lean REPL that the Python package `lean-interact` drives, at the tag for this toolchain:
# the wrapper runs it in this project, with `GLVerify` imported.
[[require]]
name = "REPL"
git = "https://github.com/augustepoiroux/repl"
rev = "v1.3.19_lean-toolchain-v4.34.0"

[[lean_lib]]
name = "GLVerify"
